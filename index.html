    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var _nativeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _nativeFetch;
              },
              set: function(newFetch) {
                if (typeof newFetch === 'function') {
                  _nativeFetch = newFetch;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch setter protection initialized with warning:', e);
        }
      })();
    </script>

  </body>
